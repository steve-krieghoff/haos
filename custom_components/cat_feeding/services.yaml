log_feeding:
  name: Fütterung eintragen
  description: >-
    Trägt eine Fütterung mit genauer Menge (und optional Futtersorte/Notiz) ein.
    Ideal für Formulare, Skripte oder Sprachbefehle mit variabler Menge.
  fields:
    amount_g:
      name: Menge
      description: Futtermenge in Gramm.
      required: true
      example: 60
      selector:
        number:
          min: 0.1
          max: 1000
          step: 0.1
          unit_of_measurement: g
          mode: box
    food_type:
      name: Futtersorte
      description: Optional, z.B. "Nassfutter Huhn" oder "Trockenfutter".
      required: false
      example: "Nassfutter Huhn"
      selector:
        text:
    note:
      name: Notiz
      description: Optionale Notiz zu dieser Fütterung.
      required: false
      selector:
        text:
    device_id:
      name: Katze (Gerät)
      description: >-
        Nur nötig, wenn mehrere Katzen konfiguriert sind. Wählt die Katze über
        das zugehörige Gerät aus.
      required: false
      selector:
        device:
          integration: cat_feeding
